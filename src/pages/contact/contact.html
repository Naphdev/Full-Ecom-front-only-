<app-summer-sale></app-summer-sale>
<app-navbar></app-navbar>

<div class="container mx-auto max-w-[1320px] p-4 sm:px-6 lg:px-8 mt-10 mb-20">
  <div class="mb-10">
    <ul class="flex gap-4">
      <li><a href="/" class="text-gray-400">Home</a></li>
      <li>/</li>
      <li><a href="/contact" class="text-gray-400">Contact</a></li>
    </ul>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Contact Info -->
    <div class="space-y-8 shadow-md rounded p-8 h-fit">
      <div class="space-y-6">
        <div class="flex items-center gap-4">
          <div class="bg-red-500 rounded-full p-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white">
              <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd" />
            </svg>
          </div>
          <h3 class="text-lg font-semibold">Call To Us</h3>
        </div>
        <div class="space-y-2 text-sm">
          <p>We are available 24/7, 7 days a week.</p>
          <p>Phone: +8801611112222</p>
        </div>
      </div>

      <hr class="border-gray-300" />

      <div class="space-y-6">
        <div class="flex items-center gap-4">
          <div class="bg-red-500 rounded-full p-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white">
              <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" />
              <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" />
            </svg>
          </div>
          <h3 class="text-lg font-semibold">Write To US</h3>
        </div>
        <div class="space-y-2 text-sm">
          <p>Fill out our form and we will contact you within 24 hours.</p>
          <p>Emails: customer&#64;exclusive.com</p>
          <p>Emails: support&#64;exclusive.com</p>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div class="lg:col-span-2 shadow-md rounded p-8">
      <form class="space-y-6" action="#" method="POST">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name *"
            class="w-full p-3 bg-[#F5F5F5] rounded border-none outline-none focus:ring-2 focus:ring-red-500"
            required
          />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your Email *"
            class="w-full p-3 bg-[#F5F5F5] rounded border-none outline-none focus:ring-2 focus:ring-red-500"
            required
          />
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Your Phone *"
            class="w-full p-3 bg-[#F5F5F5] rounded border-none outline-none focus:ring-2 focus:ring-red-500"
            required
          />
        </div>

        <textarea
          id="message"
          name="message"
          rows="8"
          placeholder="Your Message"
          class="w-full p-3 bg-[#F5F5F5] rounded border-none outline-none focus:ring-2 focus:ring-red-500 resize-none"
        ></textarea>

        <div class="flex justify-end">
          <button
            type="submit"
            class="px-8 py-3 bg-red-500 text-white rounded hover:bg-red-600 transition duration-300"
          >
            Send Message
          </button>
        </div>
      </form>
    </div>
  </div>

  <app-service-features></app-service-features>
</div>

<app-footer></app-footer>
