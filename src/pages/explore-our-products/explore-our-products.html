<div class="container mx-auto max-w-[1320px] p-4 sm:px-6 lg:px-8 mt-20">
  <div class="flex items-center gap-2 mb-4 sm:mb-5">
    <div class="bg-red-500 w-3 h-6 sm:w-4 sm:h-8 rounded-sm"></div>
    <p class="text-red-500 font-bold text-sm sm:text-base">Our Products</p>
  </div>

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <p class="text-2xl sm:text-3xl font-bold">Explore Our Products</p>

    <div class="flex items-center gap-2 self-end">
      <div>
        <button class="bg-gray-300 rounded-full p-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-4 sm:size-5 md:size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
            />
          </svg>
        </button>
      </div>

      <div>
        <button class="bg-gray-300 rounded-full p-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-4 sm:size-5 md:size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3  "
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="exploreOurProducts.length > 0">
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4 gap-12 sm:gap-16 md:gap-20 mt-6 mb-10"
    >
      <!-- Dynamic Products -->
      <app-product-card
        *ngFor="let product of exploreOurProducts"
        [product]="product"
        variant="default"
        (addToCart)="onAddToCart($event)"
        (addToWishlist)="onAddToWishlist($event)"
      ></app-product-card>
    </div>
  </div>

    <div class="flex justify-center mt-32 sm:mt-32 md:mt-32">
    <button
      class="bg-red-500 hover:bg-red-600 w-[150px] sm:w-[180px] md:w-[200px] h-[40px] sm:h-[45px] md:h-[50px] text-white px-4 sm:px-5 md:px-6 py-2 sm:py-2.5 md:py-3 rounded-md font-medium text-sm sm:text-base"
    >
      View All Products
    </button>
  </div>
</div>
