<div
  class="bg-gray-100 py-3 sm:py-4 md:py-5 w-full max-w-[250px] h-[180px] sm:h-[200px] md:h-[230px] rounded-sm flex flex-col items-center justify-center relative mt-8 mx-auto"
>
  <div *ngIf="variant === 'flashsale'"
    class="bg-red-500 w-10 h-5 sm:w-12 sm:h-6 rounded-md absolute top-0 left-0 m-3 sm:m-4 py-0.5 sm:py-1 flex items-center justify-center"
  >
    <p class="text-white text-xs sm:text-sm text-center">{{ calculateDiscount(product) }}%</p>
  </div>

  <img
    [src]="product.image"
    alt="{{ product.name }}"
    class="w-[130px] sm:w-[140px] md:w-[150px] h-auto object-contain"
  />

  <div class="absolute top-0 right-0 m-3 sm:m-4 space-y-1 sm:space-y-2">
    <!-- Wishlist icon - changes based on variant -->
    <div
      class="bg-white rounded-full p-1 cursor-pointer"
      (click)="variant === 'wishlist' ? onRemoveFromWishlist() : onAddToWishlist()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4 sm:size-5 md:size-6"
      >
        <path
          *ngIf="variant === 'wishlist'; else addToWishlistIcon"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z"
        />
        <ng-template #addToWishlistIcon>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
          />
        </ng-template>
      </svg>
    </div>

    <!-- Quick view icon -->
    <div class="bg-white rounded-full p-1" *ngIf="variant !== 'wishlist'">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4 sm:size-5 md:size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
        />
      </svg>
    </div>
  </div>

  <!-- Add to cart button - varies by variant -->
  <div
    class="absolute bottom-0 left-0 w-full bg-black rounded-sm text-white py-2 text-center cursor-pointer"
    (click)="onAddToCart()"
  >
    <i class="fa-solid fa-cart-plus me-2"></i>
    <span>Add to Cart</span>
  </div>

  <div
    class="bg-white w-full h-[90px] sm:h-[100px] rounded-sm absolute top-full left-0 py-1 sm:py-2 px-1 sm:px-2 space-y-1"
  >
    <p class="text-sm sm:text-base font-semibold truncate">{{ product.name }}</p>
    <p class="text-xs sm:text-sm">
      <span class="text-red-500">${{ product.price }}</span>
      <span class="text-gray-500 ml-1 sm:ml-2 line-through" *ngIf="product.originalPrice">
        ${{ product.originalPrice }}
      </span>
    </p>
    <div class="flex gap-0.5 sm:gap-1">
      <svg
        *ngFor="let star of getStarsArray()"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
      >
        <path
          fill-rule="evenodd"
          d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
          clip-rule="evenodd"
        />
      </svg>
      <span class="text-xs sm:text-sm" *ngIf="product.reviewCount">
        ({{ product.reviewCount }})
      </span>
    </div>
  </div>
</div>
