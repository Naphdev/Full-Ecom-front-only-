<div class="container mx-auto max-w-[1320px] p-4 sm:px-6 lg:px-8 mt-20">
  <div class="flex items-center gap-2 mb-4 sm:mb-5">
    <div class="bg-red-500 w-3 h-6 sm:w-4 sm:h-8 rounded-sm"></div>
    <p class="text-red-500 font-bold text-sm sm:text-base">This Month</p>
  </div>

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <p class="text-2xl sm:text-3xl font-bold">Best Selling Products</p>

    <div class="flex items-center gap-2 self-end">
      <button class="bg-red-500 text-white rounded-md px-8 py-3 hover:bg-red-600">View All</button>
    </div>
  </div>

  <div *ngIf="bestSellingProducts.length > 0; else noProducts">
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4 gap-10 sm:gap-16 md:gap-20 mt-6 mb-10"
    >
      <!-- Dynamic Products -->
      <div
        class="bg-gray-100 py-3 sm:py-4 md:py-5 w-full max-w-[250px] h-[180px] sm:h-[200px] md:h-[230px] rounded-sm flex flex-col items-center justify-center relative mt-8 mx-auto"
        *ngFor="let product of bestSellingProducts; let i = index"
      >
        <img
          [src]="product.image"
          alt="{{ product.name }}"
          class="w-[130px] sm:w-[140px] md:w-[150px] h-auto object-contain"
        />

        <div class="absolute top-0 right-0 m-3 sm:m-4 space-y-1 sm:space-y-2">
          <div class="bg-white rounded-full p-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4 sm:size-5 md:size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
              />
            </svg>
          </div>

          <div class="bg-white rounded-full p-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4 sm:size-5 md:size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
          </div>
        </div>

        <div
          class="bg-white w-full h-[90px] sm:h-[100px] rounded-sm absolute top-full left-0 py-1 sm:py-2 px-1 sm:px-2 space-y-1"
        >
          <p class="text-sm sm:text-base font-semibold truncate">{{ product.name }}</p>
          <p class="text-xs sm:text-sm">
            <span class="text-red-500">${{ product.price }}</span
            ><span class="text-gray-500 ml-1 sm:ml-2 line-through"
              >${{ product.originalPrice }}</span
            >
          </p>
          <div class="flex gap-0.5 sm:gap-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-4 sm:size-5 md:size-6 text-[#FFAD33]"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>

            <span class="text-xs sm:text-sm">({{ product.reviewCount }})</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Static section continues after dynamic products -->
  <div
    class="relative w-full flex flex-col md:flex-row items-start justify-start p-10 bg-black min-h-[400px] md:min-h-[400px] py-10 rounded-sm mt-32 md:col-span-3"
  >
    <div class="w-full flex flex-col md:flex-row items-center md:items-start justify-between gap-6">
      <div class="space-y-6 z-10">
        <span class="text-[#00FF66] text-sm sm:text-base font-semibold">Categories</span>
        <h1 class="text-white text-3xl md:text-4xl font-semibold">
          Enhance Your <br />
          Gaming Experience
        </h1>
        <div class="flex items-center justify-start gap-6">
          <div
            class="bg-white w-[50px] h-[50px] rounded-full my-4 flex items-center justify-center"
          >
            <p class="text-black text-center text-sm font-bold">
              23<span class="text-gray-500 text-[10px] block leading-none">Hours</span>
            </p>
          </div>
          <div
            class="bg-white w-[50px] h-[50px] rounded-full my-4 flex items-center justify-center"
          >
            <p class="text-black text-center text-sm font-bold">
              05<span class="text-gray-500 text-[10px] block leading-none">Days</span>
            </p>
          </div>
          <div
            class="bg-white w-[50px] h-[50px] rounded-full my-4 flex items-center justify-center"
          >
            <p class="text-black text-center text-sm font-bold">
              59<span class="text-gray-500 text-[10px] block leading-none">Minutes</span>
            </p>
          </div>
          <div
            class="bg-white w-[50px] h-[50px] rounded-full my-4 flex items-center justify-center"
          >
            <p class="text-black text-center text-sm font-bold">
              35<span class="text-gray-500 text-[10px] block leading-none">Seconds</span>
            </p>
          </div>
        </div>
        <div>
          <button class="bg-[#00FF66] text-white px-8 py-2 rounded-sm">Buy Now</button>
        </div>
      </div>

      <div class="md:absolute right-0 inset-y-0 flex items-center justify-center pointer-events-none">
        <img
          src="assets/best-sell/mu-ex.png"
          alt=""
          class="w-[200px] md:w-[400px] xl:w-[500px] object-contain md:mr-20"
        />
      </div>
    </div>
  </div>

  <!-- Template for when no products are available -->
  <ng-template #noProducts>
    <div class="text-center py-10">
      <p class="text-lg text-gray-500">No best selling products available at the moment.</p>
    </div>
  </ng-template>
</div>
