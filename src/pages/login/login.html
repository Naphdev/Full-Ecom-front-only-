<app-summer-sale></app-summer-sale>
<app-navbar></app-navbar>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 mx-auto py-16">
  <div>
    <img src="/assets/signup-img/dl.beatsnoop_1.png" alt="Signup Image" class="w-full h-auto" />
  </div>

  <div class="flex flex-col justify-center w-full max-w-md mx-auto space-y-8 px-6 md:px-0">
    <h2 class="text-2xl md:text-3xl font-semibold">Log in to Exclusive</h2>
    <p class="">Enter your details below</p>
    <form class="space-y-8" action="#" method="POST">
      <div class="space-y-8">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email or Phone Number"
          class="w-full p-2 border-b-4 border-gray-300 rounded"
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          class="w-full p-2 border-b-4 border-gray-300 rounded"
        />
      </div>

      <div class="flex flex-row space-x-4">
        <button type="submit" class="w-full h-[56px] p-4 border-2 bg-red-500 text-white rounded">
          Log in
        </button>
        <button type="submit" class="w-full h-[56px] p-4 border-2 bg-white text-black rounded">
          Forgot Password?
        </button>
      </div>
    </form>
  </div>
</div>
<app-footer></app-footer>
