<div
  class="container mx-auto max-w-[1320px] mt-8 px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center relative gap-4"
>
  <div class="flex items-center justify-between w-full sm:w-auto">
    <h1 class="text-2xl sm:text-3xl font-bold">Exclusive</h1>
    <button (click)="togglemenu()" class="sm:hidden focus:outline-none ml-4 z-20">
      <svg
        *ngIf="!ismenuopen()"
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
      <svg
        *ngIf="ismenuopen()"
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="ismenuopen()"
    class="sm:hidden bg-white shadow-lg rounded-lg p-4 space-y-2 top-full left-0 right-0 absolute z-10 w-full max-w-[calc(100vw-2rem)] mx-auto"
  >
    <ul class="flex flex-col space-y-2">
      <li>
        <button (click)="navigateToHome()" [class.underline]="isActiveRoute('/')"] class="block w-full text-left hover:text-blue-500 transition-colors py-2">
          Home
        </button>
      </li>
      <li>
        <button class="block w-full text-left hover:text-blue-500 transition-colors py-2">
          Contact
        </button>
      </li>
      <li>
        <button (click)="navigateToAbout()" class="block w-full text-left hover:text-blue-500 transition-colors py-2">
          About
        </button>
      </li>
      <li>
        <button
          (click)="navigateToSignup()"
          [class.underline]="isActiveRoute('/signup')"
          class="block w-full text-left hover:text-blue-500 transition-colors py-2"
        >
          Sign Up
        </button>
      </li>
    </ul>
  </div>

  <!-- Desktop Navigation -->
  <div class="hidden sm:block w-full sm:w-auto">
    <ul
      class="flex flex-wrap sm:flex-nowrap space-x-2 sm:space-x-6 lg:space-x-10 items-center justify-center"
    >
      <li>
        <button
          (click)="navigateToHome()"
          [class.underline]="isActiveRoute('/')"
          class="hover:text-blue-500 transition-colors py-2 text-sm sm:text-base"
        >
          Home
        </button>
      </li>
      <li>
        <button class="hover:text-blue-500 transition-colors py-2 text-sm sm:text-base">
          Contact
        </button>
      </li>
      <li>
        <button (click)="navigateToAbout()" [class.underline]="isActiveRoute('/about')" class="hover:text-blue-500 transition-colors py-2 text-sm sm:text-base">
          About
        </button>
      </li>
      <li>
        <button
          (click)="navigateToSignup()"
          [class.underline]="isActiveRoute('/signup')"
          class="hover:text-blue-500 transition-colors py-2 text-sm sm:text-base"
        >
          Sign Up
        </button>
      </li>
    </ul>
  </div>

  <div
    class="w-full sm:w-auto flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4 gap-4"
  >
    <div class="relative w-full sm:w-48 md:w-64 lg:w-80 xl:w-96">
      <input
        type="text"
        placeholder="What are you looking for?"
        class="pl-5 pr-12 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full text-sm font-medium placeholder-gray-500 focus:placeholder-gray-500"
      />
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
        <svg 
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-5 text-gray-400"
        >
          <path
            fill-rule="evenodd"
            d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
    </div>

    <div class="flex space-x-4" *ngIf="!isActiveRoute('/signup') && !isActiveRoute('/login')">
      <div class="">
        <button
          (click)="navigateToWishlist()"
          class="focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-full p-1 hover:bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5 sm:size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
            />
          </svg>
        </button>
      </div>

      <div class="">
        <button (click)="navigateToCart()"
          class="focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-full p-1 hover:bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5 sm:size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
            />
          </svg>
        </button>
      </div>
      <div class="">
        <button
          class="focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-full p-1 hover:bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<hr class="mt-4" />
